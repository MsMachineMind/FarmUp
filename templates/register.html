<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmUp | Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #f4f6f4;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 60px;
            background-color: transparent;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            text-decoration: none;
        }

        .logo span {
            color: #236348;
        }

        .nav-links a {
            text-decoration: none;
            color: #4b5563;
            font-weight: 500;
            font-size: 15px;
            margin-right: 20px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #111827;
        }

        /* Container */
        .register-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            border: 1px solid #e5e7eb;
        }

        .badge {
            display: inline-block;
            background-color: #e6f0eb;
            color: #236348;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .card p.subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 28px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            color: #1f2937;
            background-color: #f9fafb;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: #236348;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(35, 99, 72, 0.1);
        }

        input::placeholder {
            color: #9ca3af;
        }

        /* Mobile Input Styling */
        .phone-input {
            display: flex;
            align-items: center;
        }

        .phone-prefix {
            background-color: #f3f4f6;
            border: 1.5px solid #e5e7eb;
            border-right: none;
            padding: 12px 14px;
            border-radius: 10px 0 0 10px;
            font-size: 15px;
            font-weight: 500;
            color: #4b5563;
        }

        .phone-input input {
            border-radius: 0 10px 10px 0;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #236348;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: #1a4d38;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .footer-note {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-top: 20px;
        }

        .footer-note a {
            color: #236348;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            header {
                padding: 20px;
            }

            .card {
                padding: 24px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

/* Error Banner Styling */
.error-alert {
    background-color: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <a href="/" class="logo">FarmUp<span>.</span></a>
        <div class="nav-links">
             <a href="{{ url_for('home') }}">Home</a>
             <a href="{{ url_for('other_services') }}">Other Services</a>
            <a href="{{ url_for('about') }}">About Us</a>
        </div>
    </header>

    <!-- Form Section -->
    <div class="register-container">
        <div class="card">
            <span class="badge">• JOIN FARMUP</span>
            <h1>Create Account</h1>
            <p class="subtitle">Enter your location details to get personalized market rates.</p>
            <!-- ADDING ERROR MESSAGE BLOCK HERE -->
            {% if error %}
            <div class="error-alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/register" method="POST">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="e.g. Ramesh Kumar" required>
                </div>

                <!-- Mobile Number -->
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <div class="phone-input">
                        <span class="phone-prefix">+91</span>
                        <input type="tel" id="mobile" name="mobile" placeholder="9876543210" pattern="[0-9]{10}"
                            maxlength="10" required>
                    </div>
                </div>

                <!-- State & District in Row -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="state">State</label>
                        <select id="state" name="state" required>
                            <option value="" disabled selected>Select State</option>
                            <option value="Uttar Pradesh">Uttar Pradesh</option>
                            <option value="Madhya Pradesh">Madhya Pradesh</option>
                            <option value="Punjab">Punjab</option>
                            <option value="Haryana">Haryana</option>
                            <option value="Bihar">Bihar</option>
                            <option value="Maharashtra">Maharashtra</option>
                            <!-- Add state options as needed -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="district">District</label>
                        <input type="text" id="district" name="district" placeholder="e.g. Lucknow" required>
                    </div>
                </div>

                <!-- Village / Town -->
                <div class="form-group">
                    <label for="village_town">Village / Town</label>
                    <input type="text" id="village_town" name="village_town" placeholder="e.g. Bakshi Ka Talab"
                        required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">
                    Get Started &rarr;
                </button>
            </form>

            <p class="footer-note">
                Already registered? <a href="/login">Login here</a>
            </p>
        </div>
    </div>

</body>

</html>
