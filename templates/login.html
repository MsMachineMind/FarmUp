<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmUp | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #f4f6f4;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 60px;
            background-color: transparent;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            text-decoration: none;
        }

        .logo span {
            color: #236348;
        }

        .nav-links a {
            text-decoration: none;
            color: #4b5563;
            font-weight: 500;
            font-size: 15px;
            margin-right: 20px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #111827;
        }

        /* Container */
        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            border: 1px solid #e5e7eb;
        }

        .badge {
            display: inline-block;
            background-color: #e6f0eb;
            color: #236348;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .card p.subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 28px;
        }

        /* Error Alert Banner */
        .error-alert {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .phone-input {
            display: flex;
            align-items: center;
        }

        .phone-prefix {
            background-color: #f3f4f6;
            border: 1.5px solid #e5e7eb;
            border-right: none;
            padding: 12px 14px;
            border-radius: 10px 0 0 10px;
            font-size: 15px;
            font-weight: 500;
            color: #4b5563;
        }

        .phone-input input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 0 10px 10px 0;
            font-size: 15px;
            color: #1f2937;
            background-color: #f9fafb;
            outline: none;
            transition: all 0.2s ease;
        }

        .phone-input input:focus {
            border-color: #236348;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(35, 99, 72, 0.1);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #236348;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: #1a4d38;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .footer-note {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-top: 24px;
        }

        .footer-note a {
            color: #236348;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            header { padding: 20px; }
            .card { padding: 28px 20px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="/" class="logo">FarmUp<span>.</span></a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
             <a href="{{ url_for('other_services') }}">Other Services</a>
            <a href="{{ url_for('about') }}">About Us</a>
        </div>
    </header>

    <!-- Login Section -->
    <div class="login-container">
        <div class="card">
            <span class="badge">• WELCOME BACK</span>
            <h1>Login</h1>
            <p class="subtitle">Enter your registered mobile number to access your account.</p>

            <!-- Display Error if User Not Found -->
            {% if error %}
            <div class="error-alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <!-- Mobile Number -->
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <div class="phone-input">
                        <span class="phone-prefix">+91</span>
                        <input type="tel" id="mobile" name="mobile" value="{{ mobile_entered if mobile_entered else '' }}" placeholder="9876543210" pattern="[0-9]{10}" maxlength="10" required autofocus>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">
                    Login &rarr;
                </button>
            </form>

            <p class="footer-note">
                Don't have an account? <a href="/register">Register here</a>
            </p>
        </div>
    </div>

</body>
</html>
